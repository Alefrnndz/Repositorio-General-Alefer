<style>
  @font-face{
    font-family:'Luckiest Guy';
    font-style:normal; font-weight:400; font-display:swap;
    src:url('assets/fonts/luckiestguy.woff2') format('woff2');
  }
  @font-face{
    font-family:'Poppins';
    font-style:normal; font-weight:400; font-display:swap;
    src:url('assets/fonts/poppins-400.woff2') format('woff2');
  }
  @font-face{
    font-family:'Poppins';
    font-style:normal; font-weight:600; font-display:swap;
    src:url('assets/fonts/poppins-600.woff2') format('woff2');
  }
  @font-face{
    font-family:'Poppins';
    font-style:normal; font-weight:700; font-display:swap;
    src:url('assets/fonts/poppins-700.woff2') format('woff2');
  }
  @font-face{
    font-family:'Poppins';
    font-style:normal; font-weight:800; font-display:swap;
    src:url('assets/fonts/poppins-800.woff2') format('woff2');
  }

  :root{
    --blue:#1d5fe0;
    --blue-bright:#3d84f5;
    --blue-light:#7fd4ff;
    --blue-deep:#081a44;
    --black:#0a0d14;
    --gold:#ffd23f;
    --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--white);
    background:var(--black);
    overflow-x:hidden;
  }

  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .star{
    position:absolute;
    color:var(--gold);
    opacity:.5;
    animation:twinkle 3s ease-in-out infinite;
    filter:drop-shadow(0 0 3px rgba(255,210,63,.5));
  }
  .star.blue{color:var(--blue-light); filter:drop-shadow(0 0 3px rgba(127,212,255,.6));}
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(0.85);}
    50%{opacity:.9; transform:scale(1.05);}
  }

  /* ================= HERO ================= */
  .hero{
    position:relative;
    z-index:1;
    min-height:100svh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:32px 20px 78px;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute; inset:0;
    background-image:url('assets/fondo-saya-boys.jpg');
    background-size:cover;
    background-position:center 22%;
    transform:scale(1.04);
  }
  .hero-overlay{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(6,10,26,.35) 0%, rgba(6,10,26,.15) 30%, rgba(6,10,26,.55) 68%, rgba(6,10,26,.96) 100%);
  }

  .hero-content{
    position:relative;
    z-index:2;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 18px;
    border:2px solid var(--blue-light);
    border-radius:24px;
    background:rgba(127,212,255,.12);
    color:var(--blue-light);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
    opacity:0;
    animation:fade-up .8s ease-out .2s forwards;
  }

  .hero-title{
    font-family:'Luckiest Guy',cursive;
    font-weight:400;
    font-size:clamp(56px, 17vw, 92px);
    line-height:.95;
    color:var(--white);
    -webkit-text-stroke:2px var(--blue-deep);
    text-shadow:0 6px 0 rgba(0,0,0,.35), 0 0 40px rgba(127,212,255,.35);
    opacity:0;
    animation:fade-up .9s ease-out .35s forwards;
  }

  .hero-age{
    font-family:'Luckiest Guy',cursive;
    font-size:clamp(24px, 7vw, 34px);
    color:var(--gold);
    -webkit-text-stroke:1.3px var(--blue-deep);
    margin-top:4px;
    opacity:0;
    animation:fade-up .9s ease-out .5s forwards;
  }

  /* candles = 6 años */
  .candles{
    display:flex;
    align-items:flex-end;
    gap:7px;
    margin-top:22px;
    height:46px;
    opacity:0;
    animation:fade-up .9s ease-out .68s forwards;
  }
  .candle{
    position:relative;
    width:7px;
    height:26px;
    border-radius:2px;
    background:repeating-linear-gradient(180deg, var(--white) 0 4px, var(--blue-bright) 4px 8px);
  }
  .candle:nth-child(3n+1){height:30px;}
  .candle:nth-child(3n+2){height:22px;}
  .candle::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:100%;
    width:9px;
    height:14px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 30%, #fff6c8 0%, var(--gold) 45%, #ff8a2b 75%, transparent 78%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    filter:drop-shadow(0 0 6px rgba(255,180,60,.8));
    animation:flicker 1.3s ease-in-out infinite;
    transform-origin:bottom center;
  }
  .candle:nth-child(2)::after{animation-delay:.15s; animation-duration:1.5s;}
  .candle:nth-child(3)::after{animation-delay:.35s; animation-duration:1.1s;}
  .candle:nth-child(4)::after{animation-delay:.5s; animation-duration:1.4s;}
  .candle:nth-child(5)::after{animation-delay:.2s; animation-duration:1.25s;}
  .candle:nth-child(6)::after{animation-delay:.4s; animation-duration:1.35s;}
  @keyframes flicker{
    0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg);}
    25%{transform:translateX(-50%) scale(1.08,.94) rotate(2deg);}
    50%{transform:translateX(-50%) scale(.92,1.08) rotate(-1deg);}
    75%{transform:translateX(-50%) scale(1.05,.97) rotate(3deg);}
  }

  .scroll-hint{
    position:absolute;
    bottom:16px; left:50%;
    transform:translateX(-50%);
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--blue-light);
    opacity:0;
    animation:fade-up .8s ease-out 1s forwards;
  }
  .scroll-hint svg{width:16px; height:16px; animation:bounce 1.8s ease-in-out infinite;}
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }

  @keyframes fade-up{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ================= DETAILS ================= */
  .details{
    position:relative;
    z-index:1;
    background:linear-gradient(180deg, var(--black) 0%, #0c1230 45%, var(--blue-deep) 100%);
    padding:38px 18px 46px;
    display:flex;
    justify-content:center;
  }
  .panel{
    max-width:420px;
    width:100%;
    text-align:center;
  }

  .reveal{
    opacity:0;
    transform:translateY(16px);
    transition:opacity .7s ease-out, transform .7s ease-out;
  }
  .reveal.in-view{opacity:1; transform:translateY(0);}

  .countdown-label{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--blue-light);
    margin-bottom:12px;
  }
  .countdown{
    display:flex; justify-content:center; gap:10px;
    margin-bottom:30px;
  }
  .cbox{
    background:rgba(127,212,255,.06);
    border:2px solid var(--blue-light);
    border-radius:12px;
    padding:10px 5px;
    width:66px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .cbox .num{
    font-family:'Luckiest Guy',cursive;
    font-size:24px;
    color:var(--gold);
    line-height:1.1;
  }
  .cbox .lbl{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--blue-light); opacity:.9; font-weight:600;}

  .divider{
    width:70px; height:2px; margin:0 auto 28px;
    background:linear-gradient(90deg, transparent, var(--blue-light), transparent);
  }

  .info-rows{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:30px;
  }
  .info-row{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    background:rgba(127,212,255,.05);
    border:1px solid rgba(127,212,255,.25);
    border-radius:14px;
    padding:12px 14px;
  }
  .info-row svg{width:24px; height:24px; stroke:var(--gold); fill:none; stroke-width:1.7; flex:none;}
  .info-row .t1{font-weight:700; font-size:14.5px; color:var(--white);}
  .info-row .t2{font-size:12.5px; color:var(--blue-light); opacity:.9;}

  .rsvp-label{
    font-family:'Luckiest Guy',cursive;
    font-size:clamp(21px, 6vw, 26px);
    white-space:nowrap;
    color:var(--white);
    -webkit-text-stroke:1px var(--blue-deep);
    margin-bottom:16px;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:14px 18px;
    border-radius:14px;
    font-family:'Luckiest Guy',cursive;
    font-weight:400;
    font-size:15.5px;
    letter-spacing:.5px;
    text-decoration:none;
    border:3px solid var(--black);
    box-shadow:4px 4px 0 var(--black);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--black);}
  .btn svg{width:19px; height:19px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--blue-bright), var(--blue));
    color:var(--white);
  }
  .btn-outline{
    background:var(--white);
    color:var(--blue-deep);
  }

  .footer-note{
    margin-top:22px;
    font-size:12px;
    color:var(--blue-light);
    opacity:.85;
    letter-spacing:.5px;
    font-weight:600;
  }

  @media (max-width:380px){
    .cbox{width:56px;}
    .info-row{padding:10px 12px;}
  }

  /* ================= MOBILE: todo pensado para caber en un iPhone 14+ (390x844) sin scroll; en pantallas más chicas puede haber scroll y no pasa nada ================= */
  .mobile-bg{display:none;}

  @media (max-width:640px){
    .mobile-bg{
      display:block;
      position:fixed; inset:0; z-index:-1;
      background-image:
        radial-gradient(ellipse 70% 42% at center 53%, rgba(6,10,26,.7), transparent 70%),
        linear-gradient(180deg, rgba(6,10,26,.10) 0%, rgba(6,10,26,.12) 28%, rgba(6,10,26,.42) 58%, rgba(6,10,26,.6) 76%, rgba(6,10,26,.9) 100%),
        url('assets/fondo-saya-boys-movil2.jpg');
      background-size:100% 100%, 100% 100%, cover;
      background-position:center, center, center center;
      background-repeat:no-repeat;
    }

    .hero-bg,.hero-overlay,.scroll-hint{display:none;}
    .details{background:transparent;}

    .hero{
      position:relative;
      min-height:0;
      padding:27svh 16px 0;
    }
    .hero-content{gap:clamp(5px,1.3svh,10px);}

    .badge{
      font-size:clamp(10.5px,2.4svh,12.5px);
      padding:clamp(4px,1svh,6px) 14px;
      margin-bottom:0;
      letter-spacing:1.5px;
      background:rgba(8,20,50,.55);
    }
    .hero-title{
      font-size:clamp(38px,9svh,54px);
      -webkit-text-stroke:1.8px var(--blue-deep);
      text-shadow:0 4px 0 rgba(0,0,0,.45), 0 10px 22px rgba(0,0,0,.55), 0 0 30px rgba(127,212,255,.3);
    }
    .hero-age{
      font-size:clamp(16px,3.6svh,20px);
      margin-top:0;
      -webkit-text-stroke:1px var(--blue-deep);
      text-shadow:0 3px 0 rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.5);
    }
    .candles{
      margin-top:clamp(6px,1.4svh,11px);
      height:clamp(22px,4.6svh,30px);
      gap:4px;
    }
    .candle{width:4px;}
    .candle::after{width:7px; height:11px;}

    .details{
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(8px,1.8svh,14px) 16px clamp(10px,2svh,16px);
    }
    .panel{display:flex; flex-direction:column; align-items:center;}

    /* el contador pasa al final, ya que en esta imagen la franja vacía es más corta */
    .info-rows{order:1;}
    .rsvp-label{order:2;}
    .buttons{order:3;}
    .divider{order:4;}
    .countdown-wrap{order:5;}
    .footer-note{order:6;}

    .countdown-label{font-size:clamp(10.5px,2.2svh,12px); margin-bottom:clamp(4px,.9svh,7px);}
    .countdown{gap:7px; margin-bottom:0;}
    .cbox{width:clamp(50px,14vw,64px); padding:clamp(6px,1.2svh,9px) 4px; border-width:2px; border-radius:10px;}
    .cbox .num{font-size:clamp(17px,3.6svh,22px);}
    .cbox .lbl{font-size:9px;}

    .divider{margin:0 auto clamp(8px,1.8svh,14px);}

    .info-rows{gap:clamp(6px,1.3svh,10px); margin-bottom:clamp(8px,1.8svh,14px); width:100%;}
    .info-row{padding:clamp(7px,1.4svh,10px) 12px; gap:11px; border-radius:11px;}
    .info-row svg{width:18px; height:18px;}
    .info-row .t1{font-size:12.5px;}
    .info-row .t2{font-size:10.5px;}

    .rsvp-label{font-size:clamp(16px,3.6svh,20px); margin-bottom:clamp(6px,1.3svh,11px); -webkit-text-stroke:.9px var(--blue-deep);}

    .buttons{gap:clamp(7px,1.5svh,11px); width:100%;}
    .btn{padding:clamp(9px,2svh,13px) 16px; font-size:clamp(12.5px,2.8svh,15px); border-width:2.5px; box-shadow:3.5px 3.5px 0 var(--black); border-radius:11px;}
    .btn svg{width:15px; height:15px;}

    .footer-note{margin-top:clamp(8px,1.6svh,13px); font-size:10.5px; text-shadow:0 2px 6px rgba(0,0,0,.6);}
  }
</style>

<script>
  // twinkling stars
  (function(){
    var container = document.getElementById('stars');
    var count = window.innerWidth < 480 ? 20 : 32;
    for (var i=0;i<count;i++){
      var s = document.createElement('div');
      var isBlue = Math.random() < 0.45;
      s.className='star'+(isBlue?' blue':'');
      s.textContent='✦';
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*100)+'%';
      s.style.fontSize = (7+Math.random()*11)+'px';
      s.style.animationDelay = (Math.random()*3)+'s';
      s.style.animationDuration = (2.4+Math.random()*2.4)+'s';
      container.appendChild(s);
    }
  })();

  // countdown to Sat Oct 3 2026, 10:00 La Paz time (UTC-4)
  (function(){
    var target = new Date('2026-10-03T10:00:00-04:00').getTime();
    var d = document.getElementById('cd-d');
    var h = document.getElementById('cd-h');
    var m = document.getElementById('cd-m');
    var s = document.getElementById('cd-s');
    function tick(){
      var diff = target - Date.now();
      if (diff <= 0){
        d.textContent='0'; h.textContent='0'; m.textContent='0'; s.textContent='0';
        return;
      }
      var days = Math.floor(diff/86400000);
      var hours = Math.floor((diff%86400000)/3600000);
      var mins = Math.floor((diff%3600000)/60000);
      var secs = Math.floor((diff%60000)/1000);
      d.textContent=days; h.textContent=hours; m.textContent=mins; s.textContent=secs;
    }
    tick();
    setInterval(tick, 1000);
  })();

  // RSVP WhatsApp link
  (function(){

  // reveal-on-scroll for the details section
  (function(){
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)){
      els.forEach(function(el){ el.classList.add('in-view'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    els.forEach(function(el){ io.observe(el); });
  })();
</script>
