<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¡Francisco cumple 6 años! — Fiesta Saja Boys</title>
<meta name="description" content="Invitación al cumpleaños de Francisco, temática Saja Boys - Sábado 3 de octubre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sancreek&family=Alex+Brush&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --navy-deep:#0a1230;
    --navy:#0e1a45;
    --navy-light:#16255e;
    --gold:#d8b46a;
    --gold-bright:#f3d98b;
    --gold-dark:#a8823f;
    --magenta:#e6349c;
    --magenta-glow:rgba(230,52,156,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--navy-deep);
    overflow-x:hidden;
  }
  body{
    font-family:'Poppins',sans-serif;
    color:var(--gold-bright);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    position:relative;
  }

  /* ---- background ---- */
  .bg{
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 20% 12%, rgba(230,52,156,0.22), transparent 50%),
      radial-gradient(circle at 85% 82%, rgba(60,90,180,0.30), transparent 55%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 45%, #0c1638 100%);
    z-index:0;
    animation:glow-shift 8s ease-in-out infinite alternate;
  }
  @keyframes glow-shift{
    from{filter:brightness(1);}
    to{filter:brightness(1.12);}
  }
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .star{
    position:absolute;
    color:var(--gold);
    opacity:.55;
    animation:twinkle 3.2s ease-in-out infinite;
    filter:drop-shadow(0 0 3px rgba(216,180,106,.5));
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(0.85);}
    50%{opacity:.9; transform:scale(1.05);}
  }

  /* ---- card ---- */
  .card{
    position:relative;
    z-index:1;
    max-width:460px;
    width:100%;
    padding:34px 24px 30px;
    text-align:center;
    border:1px solid rgba(216,180,106,.55);
    border-radius:6px;
    background:linear-gradient(180deg, rgba(20,32,75,.55), rgba(10,18,48,.65));
    box-shadow:0 0 0 1px rgba(216,180,106,.15), 0 25px 60px rgba(0,0,0,.55);
    opacity:0;
    animation:card-in 1s ease-out .15s forwards;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(216,180,106,.35);
    border-radius:3px;
    pointer-events:none;
  }
  @keyframes card-in{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  .gat-wrap{
    position:relative;
    width:64px;
    height:64px;
    margin:0 auto;
    animation:sway 3.4s ease-in-out infinite;
  }
  .gat-wrap::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle, var(--magenta-glow), transparent 70%);
    filter:blur(4px);
    animation:pulse-glow 2.6s ease-in-out infinite;
  }
  .gat-wrap svg{
    position:relative;
    width:100%; height:100%;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
  }
  @keyframes pulse-glow{
    0%,100%{opacity:.55; transform:scale(.92);}
    50%{opacity:1; transform:scale(1.08);}
  }
  @keyframes sway{
    0%,100%{transform:rotate(-5deg);}
    50%{transform:rotate(5deg);}
  }

  .theme-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    padding:5px 14px;
    border:1px solid var(--magenta);
    border-radius:20px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#ff9ed8;
    background:rgba(230,52,156,.1);
    opacity:0;
    animation:fade-up .8s ease-out .4s forwards;
  }

  .eyebrow{
    font-size:12.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:10px;
    opacity:0;
    animation:fade-up .8s ease-out .5s forwards;
  }

  .name{
    position:relative;
    font-family:'Sancreek',cursive;
    font-size:clamp(48px, 15vw, 68px);
    line-height:1;
    letter-spacing:1px;
    margin-top:8px;
    background:linear-gradient(180deg, var(--gold-bright) 10%, var(--gold) 55%, var(--gold-dark) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 18px rgba(216,180,106,.25);
    opacity:0;
    animation:fade-up .9s ease-out .7s forwards;
  }
  .name::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:220px; height:90px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, var(--magenta-glow), transparent 70%);
    filter:blur(18px);
    z-index:-1;
    animation:pulse-glow 3.2s ease-in-out infinite;
  }

  .age{
    font-family:'Sancreek',cursive;
    font-size:clamp(22px, 6.5vw, 28px);
    color:var(--gold-bright);
    margin-top:2px;
    letter-spacing:1px;
    opacity:0;
    animation:fade-up .9s ease-out .9s forwards;
  }

  .divider{
    width:70px; height:2px; margin:20px auto;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0;
    animation:fade-up .8s ease-out 1.05s forwards;
  }

  .details{
    display:flex;
    justify-content:center;
    gap:34px;
    margin:6px 0 22px;
    opacity:0;
    animation:fade-up .8s ease-out 1.2s forwards;
  }
  .detail{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .detail svg{width:30px; height:30px; stroke:var(--gold); fill:none; stroke-width:1.6;}
  .detail .d1{font-weight:600; font-size:14.5px; color:var(--gold-bright); letter-spacing:.5px;}
  .detail .d2{font-size:12.5px; color:var(--gold); opacity:.85;}

  /* countdown */
  .countdown{
    display:flex; justify-content:center; gap:10px;
    margin-bottom:22px;
    opacity:0;
    animation:fade-up .8s ease-out 1.35s forwards;
  }
  .cbox{
    background:rgba(216,180,106,.08);
    border:1px solid rgba(216,180,106,.35);
    border-radius:8px;
    padding:8px 4px;
    width:62px;
  }
  .cbox .num{font-size:20px; font-weight:700; color:var(--gold-bright);}
  .cbox .lbl{font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); opacity:.75;}

  .venue{
    font-size:13.5px;
    line-height:1.6;
    color:var(--gold-bright);
    opacity:.9;
    margin-bottom:22px;
  }
  .venue b{color:var(--gold-bright); font-weight:600; letter-spacing:.5px;}

  .rsvp-label{
    font-family:'Alex Brush',cursive;
    font-size:clamp(22px, 6.5vw, 28px);
    white-space:nowrap;
    color:var(--gold-bright);
    margin-bottom:16px;
    opacity:0;
    animation:fade-up .8s ease-out 1.5s forwards;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
    opacity:0;
    animation:fade-up .8s ease-out 1.65s forwards;
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:13px 18px;
    border-radius:30px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    letter-spacing:.3px;
    transition:transform .18s ease, box-shadow .18s ease;
    border:1px solid transparent;
  }
  .btn:active{transform:scale(.97);}
  .btn svg{width:18px; height:18px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
    color:var(--navy-deep);
    box-shadow:0 8px 24px rgba(216,180,106,.28);
  }
  .btn-primary:hover{box-shadow:0 10px 28px rgba(216,180,106,.42); transform:translateY(-1px);}
  .btn-outline{
    background:transparent;
    border-color:rgba(216,180,106,.55);
    color:var(--gold-bright);
  }
  .btn-outline:hover{background:rgba(216,180,106,.08); transform:translateY(-1px);}

  .footer-note{
    margin-top:20px;
    font-size:11px;
    color:var(--gold);
    opacity:.6;
    letter-spacing:.5px;
  }

  @keyframes fade-up{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (max-width:380px){
    .details{gap:22px;}
    .cbox{width:54px;}
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>

<div class="card">
  <div class="gat-wrap">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="70" rx="46" ry="9" fill="#111319"/>
      <ellipse cx="50" cy="70" rx="46" ry="9" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity=".8"/>
      <path d="M27 68 Q27 40 50 38 Q73 40 73 68 Z" fill="#1a1d26"/>
      <ellipse cx="50" cy="38" rx="10" ry="4" fill="#0d0f14"/>
      <ellipse cx="50" cy="68" rx="23" ry="5.5" fill="none" stroke="var(--gold)" stroke-width="1.3" opacity=".7"/>
    </svg>
  </div>
  <div class="theme-badge">🎤 Temática Saja Boys</div>
  <div class="eyebrow">¡Estás invitado a celebrar!</div>
  <h1 class="name">Francisco</h1>
  <div class="age">¡Cumple 6 años!</div>

  <div class="divider"></div>

  <div class="details">
    <div class="detail">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/></svg>
      <div class="d1">Sábado</div>
      <div class="d2">3 de octubre</div>
    </div>
    <div class="detail">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <div class="d1">10:00 — 14:00</div>
      <div class="d2">Hrs.</div>
    </div>
  </div>

  <div class="countdown" id="countdown">
    <div class="cbox"><div class="num" id="cd-d">–</div><div class="lbl">Días</div></div>
    <div class="cbox"><div class="num" id="cd-h">–</div><div class="lbl">Hrs</div></div>
    <div class="cbox"><div class="num" id="cd-m">–</div><div class="lbl">Min</div></div>
    <div class="cbox"><div class="num" id="cd-s">–</div><div class="lbl">Seg</div></div>
  </div>

  <div class="venue">
    <b>LA CASA DEL ÁRBOL</b><br>
    Calle 20 de Calacoto #7835
  </div>

  <div class="rsvp-label">🎶 Confirma tu asistencia</div>

  <div class="buttons">
    <a class="btn btn-primary" id="rsvp-btn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.06-1.33C8.5 21.5 10.2 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.63-1.28 1.2-1.76 1.24-.45.05-.9.23-3.03-.63-2.57-1.05-4.24-3.62-4.37-3.79-.13-.17-1.04-1.39-1.04-2.65s.66-1.87.9-2.13c.22-.24.5-.3.66-.3.17 0 .33 0 .48.01.16.01.36-.06.56.43.22.53.73 1.83.8 1.97.06.13.1.29.02.46-.08.17-.13.28-.25.43-.13.15-.27.34-.38.46-.13.13-.26.28-.11.54.15.26.66 1.09 1.42 1.76.98.87 1.8 1.14 2.06 1.27.26.13.41.11.56-.07.15-.18.65-.75.82-1.01.17-.26.34-.22.56-.13.22.09 1.42.67 1.66.79.24.12.4.18.46.28.06.11.06.62-.16 1.25z"/></svg>
      Confirmar por WhatsApp
    </a>
    <a class="btn btn-outline" href="https://www.google.com/maps/search/?api=1&query=La+Casa+del+%C3%81rbol%2C+Calle+20+de+Calacoto+%237835%2C+La+Paz%2C+Bolivia" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.6"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      Cómo llegar
    </a>
  </div>

  <div class="footer-note">Ven listo para bailar como un Saja Boy ✨🎤</div>
</div>

<script>
  // twinkling stars
  (function(){
    var container = document.getElementById('stars');
    var count = window.innerWidth < 480 ? 18 : 28;
    for (var i=0;i<count;i++){
      var s = document.createElement('div');
      var isMagenta = Math.random() < 0.3;
      s.className='star';
      s.textContent='✦';
      if (isMagenta){
        s.style.color = 'var(--magenta)';
        s.style.filter = 'drop-shadow(0 0 3px rgba(230,52,156,.6))';
      }
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*100)+'%';
      s.style.fontSize = (8+Math.random()*14)+'px';
      s.style.animationDelay = (Math.random()*3)+'s';
      s.style.animationDuration = (2.4+Math.random()*2.4)+'s';
      container.appendChild(s);
    }
  })();

  // countdown to Sat Oct 3 2026, 10:00 La Paz time (UTC-4)
  (function(){
    var target = new Date('2026-10-03T10:00:00-04:00').getTime();
    var d = document.getElementById('cd-d');
    var h = document.getElementById('cd-h');
    var m = document.getElementById('cd-m');
    var s = document.getElementById('cd-s');
    function tick(){
      var diff = target - Date.now();
      if (diff <= 0){
        d.textContent='0'; h.textContent='0'; m.textContent='0'; s.textContent='0';
        return;
      }
      var days = Math.floor(diff/86400000);
      var hours = Math.floor((diff%86400000)/3600000);
      var mins = Math.floor((diff%3600000)/60000);
      var secs = Math.floor((diff%60000)/1000);
      d.textContent=days; h.textContent=hours; m.textContent=mins; s.textContent=secs;
    }
    tick();
    setInterval(tick, 1000);
  })();

  // RSVP WhatsApp link
  (function(){
    var phone = '59177284438';
    var msg = '¡Hola! Queremos confirmar nuestra asistencia a la fiesta Saja Boys de Francisco 🎤🖤✨ (Sábado 3 de octubre). Seremos: ';
    var link = document.getElementById('rsvp-btn');
    link.href = 'https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
  })();
</script>

</body>
</html>
