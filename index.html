<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¡Francisco cumple 6 años! — Fiesta Saya Boys</title>
<meta name="description" content="Invitación al cumpleaños de Francisco, temática Saya Boys - Sábado 3 de octubre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --blue:#1d5fe0;
    --blue-bright:#3d84f5;
    --blue-light:#7fd4ff;
    --blue-deep:#081a44;
    --black:#0a0d14;
    --gold:#ffd23f;
    --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--black); overflow-x:hidden;}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--white);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    position:relative;
  }

  /* ---- background ---- */
  .bg{
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 18% 10%, rgba(127,212,255,0.28), transparent 50%),
      radial-gradient(circle at 88% 85%, rgba(61,132,245,0.30), transparent 55%),
      linear-gradient(160deg, var(--blue-deep) 0%, #0c1230 55%, var(--black) 100%);
    z-index:0;
  }
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .star{
    position:absolute;
    color:var(--gold);
    opacity:.5;
    animation:twinkle 3s ease-in-out infinite;
    filter:drop-shadow(0 0 3px rgba(255,210,63,.5));
  }
  .star.blue{color:var(--blue-light); filter:drop-shadow(0 0 3px rgba(127,212,255,.6));}
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(0.85);}
    50%{opacity:.9; transform:scale(1.05);}
  }

  /* ---- card ---- */
  .card{
    position:relative;
    z-index:1;
    max-width:440px;
    width:100%;
    border-radius:22px;
    overflow:hidden;
    border:4px solid var(--white);
    box-shadow:0 0 0 4px var(--black), 0 25px 60px rgba(0,0,0,.6);
    opacity:0;
    animation:card-in .9s ease-out .1s forwards;
    background:var(--blue-deep);
  }
  @keyframes card-in{
    from{opacity:0; transform:translateY(18px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .poster{
    display:block;
    width:100%;
    height:auto;
  }

  .content{
    padding:22px 20px 24px;
    text-align:center;
  }

  /* countdown */
  .countdown{
    display:flex; justify-content:center; gap:9px;
    margin-bottom:20px;
    opacity:0;
    animation:fade-up .8s ease-out .3s forwards;
  }
  .cbox{
    background:var(--black);
    border:2.5px solid var(--blue-light);
    border-radius:10px;
    padding:8px 4px;
    width:60px;
    box-shadow:3px 3px 0 rgba(0,0,0,.5);
  }
  .cbox .num{
    font-family:'Luckiest Guy',cursive;
    font-size:22px;
    color:var(--gold);
    line-height:1.1;
  }
  .cbox .lbl{font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--blue-light); opacity:.9; font-weight:600;}

  .rsvp-label{
    font-family:'Luckiest Guy',cursive;
    font-size:clamp(20px, 6vw, 25px);
    letter-spacing:.5px;
    color:var(--white);
    -webkit-text-stroke:1px var(--blue-deep);
    margin-bottom:14px;
    opacity:0;
    animation:fade-up .8s ease-out .45s forwards;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:13px;
    opacity:0;
    animation:fade-up .8s ease-out .6s forwards;
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:14px 18px;
    border-radius:14px;
    font-family:'Luckiest Guy',cursive;
    font-weight:400;
    font-size:15.5px;
    letter-spacing:.5px;
    text-decoration:none;
    border:3px solid var(--black);
    box-shadow:4px 4px 0 var(--black);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--black);}
  .btn svg{width:19px; height:19px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--blue-bright), var(--blue));
    color:var(--white);
  }
  .btn-outline{
    background:var(--white);
    color:var(--blue-deep);
  }

  .footer-note{
    margin-top:18px;
    font-size:12px;
    color:var(--blue-light);
    opacity:.85;
    letter-spacing:.5px;
    font-weight:600;
    opacity:0;
    animation:fade-up .8s ease-out .75s forwards;
  }

  @keyframes fade-up{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (max-width:380px){
    .cbox{width:52px;}
    .content{padding:18px 14px 20px;}
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>

<div class="card">
  <img class="poster" src="assets/invitacion-francisco.jpg" alt="Invitación al cumpleaños de Francisco, temática Saya Boys. Sábado 3 de octubre, de 10:00 a 14:00, en La Casa del Árbol, Calle 20 de Calacoto #7835.">

  <div class="content">
    <div class="countdown" id="countdown">
      <div class="cbox"><div class="num" id="cd-d">–</div><div class="lbl">Días</div></div>
      <div class="cbox"><div class="num" id="cd-h">–</div><div class="lbl">Hrs</div></div>
      <div class="cbox"><div class="num" id="cd-m">–</div><div class="lbl">Min</div></div>
      <div class="cbox"><div class="num" id="cd-s">–</div><div class="lbl">Seg</div></div>
    </div>

    <div class="rsvp-label">¡Confirma tu asistencia!</div>

    <div class="buttons">
      <a class="btn btn-primary" id="rsvp-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.06-1.33C8.5 21.5 10.2 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.63-1.28 1.2-1.76 1.24-.45.05-.9.23-3.03-.63-2.57-1.05-4.24-3.62-4.37-3.79-.13-.17-1.04-1.39-1.04-2.65s.66-1.87.9-2.13c.22-.24.5-.3.66-.3.17 0 .33 0 .48.01.16.01.36-.06.56.43.22.53.73 1.83.8 1.97.06.13.1.29.02.46-.08.17-.13.28-.25.43-.13.15-.27.34-.38.46-.13.13-.26.28-.11.54.15.26.66 1.09 1.42 1.76.98.87 1.8 1.14 2.06 1.27.26.13.41.11.56-.07.15-.18.65-.75.82-1.01.17-.26.34-.22.56-.13.22.09 1.42.67 1.66.79.24.12.4.18.46.28.06.11.06.62-.16 1.25z"/></svg>
        Confirmar por WhatsApp
      </a>
      <a class="btn btn-outline" href="https://www.google.com/maps/search/?api=1&query=La+Casa+del+%C3%81rbol%2C+Calle+20+de+Calacoto+%237835%2C+La+Paz%2C+Bolivia" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        Cómo llegar
      </a>
    </div>

    <div class="footer-note">👑 SAYA BOYS · Francisco cumple 6 años 💙</div>
  </div>
</div>

<script>
  // twinkling stars
  (function(){
    var container = document.getElementById('stars');
    var count = window.innerWidth < 480 ? 18 : 28;
    for (var i=0;i<count;i++){
      var s = document.createElement('div');
      var isBlue = Math.random() < 0.45;
      s.className='star'+(isBlue?' blue':'');
      s.textContent='✦';
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*100)+'%';
      s.style.fontSize = (8+Math.random()*14)+'px';
      s.style.animationDelay = (Math.random()*3)+'s';
      s.style.animationDuration = (2.4+Math.random()*2.4)+'s';
      container.appendChild(s);
    }
  })();

  // countdown to Sat Oct 3 2026, 10:00 La Paz time (UTC-4)
  (function(){
    var target = new Date('2026-10-03T10:00:00-04:00').getTime();
    var d = document.getElementById('cd-d');
    var h = document.getElementById('cd-h');
    var m = document.getElementById('cd-m');
    var s = document.getElementById('cd-s');
    function tick(){
      var diff = target - Date.now();
      if (diff <= 0){
        d.textContent='0'; h.textContent='0'; m.textContent='0'; s.textContent='0';
        return;
      }
      var days = Math.floor(diff/86400000);
      var hours = Math.floor((diff%86400000)/3600000);
      var mins = Math.floor((diff%3600000)/60000);
      var secs = Math.floor((diff%60000)/1000);
      d.textContent=days; h.textContent=hours; m.textContent=mins; s.textContent=secs;
    }
    tick();
    setInterval(tick, 1000);
  })();

  // RSVP WhatsApp link
  (function(){
    var phone = '59177284438';
    var msg = '¡Hola! Queremos confirmar nuestra asistencia a la fiesta Saya Boys de Francisco 👑💙 (Sábado 3 de octubre). Seremos: ';
    var link = document.getElementById('rsvp-btn');
    link.href = 'https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
  })();
</script>

</body>
</html>
